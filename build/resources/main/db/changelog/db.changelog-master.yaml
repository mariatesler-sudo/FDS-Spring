databaseChangeLog:
  - changeSet:
      id: 001-create-currency-table
      author: you
      changes:
        - createTable:
            tableName: currency
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
                  defaultValueComputed: "gen_random_uuid()"
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: base_currency
                  type: VARCHAR(10)
                  defaultValue: 'RUB'
              - column:
                  name: price_change_range
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: deleted
                  type: BOOLEAN
                  defaultValueBoolean: false