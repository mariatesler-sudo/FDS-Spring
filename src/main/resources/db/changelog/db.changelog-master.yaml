databaseChangeLog:
  - changeSet:
      id: 001-create-currency-table
      author: me
      changes:
        - createTable:
            tableName: currency
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: base_currency
                  type: VARCHAR(10)
                  defaultValue: 'RUB'
              - column:
                  name: price_change_range
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
